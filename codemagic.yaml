workflows:
  android-workflow:
    name: Codemagic Android Build Workflow
    max_build_duration: 30
    environment:
      node: latest
    scripts:
      - name: Locate App.js and Build Android AAB and APK
        script: |
          # 1. App.js की लोकेशन ढूँढना
          APP_PATH=$(find . -name "App.js" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "app.json" -not -path "*/node_modules/*" | head -n 1)
          fi
          
          PROJECT_DIR=$(dirname "$APP_PATH")
          echo "Codemagic is building from directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 2. प्रोजेक्ट डिपेंडेंसी इंस्टॉल करना
          npm install

          # 3. अगर एंड्रॉइड फोल्डर नहीं है तो उसे जनरेट करना
          if [ ! -d "android" ]; then
            npx react-native eject || npx expo prebuild --platform android --clean
          fi

          # 4. Android Gradle से AAB और APK बनाना
          cd android
          chmod +x gradlew
          echo "Codemagic: Building Release AAB..."
          ./gradlew bundleRelease
          echo "Codemagic: Building Release APK..."
          ./gradlew assembleRelease
    artifacts:
      - '**/build/outputs/bundle/release/*.aab'
      - '**/build/outputs/apk/release/*.apk'
      
