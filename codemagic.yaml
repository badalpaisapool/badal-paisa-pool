workflows:
  android-workflow:
    name: Android AAB and APK Workflow
    max_build_duration: 30
    environment:
      node: latest
    scripts:
      - name: Prebuild and Build Android
        script: |
          npm install
          npx expo prebuild --platform android --non-interactive
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
    artifacts:
      - '**/build/outputs/bundle/release/*.aab'
      - '**/build/outputs/apk/release/*.apk'
      
