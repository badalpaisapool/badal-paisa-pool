workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 30
    working_directory: app
    environment:
      node: latest
    scripts:
      - name: Build Android APK
        script: |
          npm install
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
      
