workflows:
  android-workflow:
    name: Android AAB and APK Workflow
    max_build_duration: 30
    environment:
      node: latest
    scripts:
      - name: Build Android AAB and APK
        script: |
          npm install
          npx expo prebuild --platform android --non-interactive --clear
          cd android
          chmod +x gradlew
          echo "Building AAB..."
          ./gradlew bundleRelease
          echo "Building APK..."
          ./gradlew assembleRelease
    artifacts:
      - '**/build/outputs/bundle/release/*.aab'
      - '**/build/outputs/apk/release/*.apk'
      
