workflows:
  android-workflow:
    name: Android AAB and APK Workflow
    max_build_duration: 30
    environment:
      node: latest
    scripts:
      - name: Build Android AAB and APK
        script: |
          PROJECT_DIR=$(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;)
          echo "Found project directory at: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          npm install
          npx expo prebuild --platform android --clean
          cd android
          chmod +x gradlew
          echo "Building AAB..."
          ./gradlew bundleRelease
          echo "Building APK..."
          ./gradlew assembleRelease
    artifacts:
      - '**/build/outputs/bundle/release/*.aab'
      - '**/build/outputs/apk/release/*.apk'
